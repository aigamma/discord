name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Lint
        run: npm run lint

      - name: npm audit (high+ only)
        # Fail on high or critical advisories against the production
        # dependency set. Moderate and below are noise on a 3-dep
        # project; high/critical demand operator attention.
        run: npm audit --omit=dev --audit-level=high

      - name: Parse-check every source module
        run: |
          for f in src/**/*.js src/*.js scripts/*.js; do
            node --check "$f"
          done

      - name: Check for accidentally-committed secrets
        run: |
          # Patterns for the credential formats this bot uses:
          # sk-ant-* (Anthropic), sb_secret_* (Supabase), pa-* (Voyage),
          # plus 24+ char Discord bot tokens (alpha-num + . + - + _).
          # Exclude .env.example which is a template with no values.
          if git grep -nE "sk-ant-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|pa-[A-Za-z0-9_-]{20,}" -- ':(exclude).env.example'; then
            echo "Possible secret committed; refusing to pass CI"
            exit 1
          fi
          # Also reject any tracked .env* file except the .env.example
          # template. Catches .env, .env.local, .env.production,
          # .env.staging, .env.dev.local, etc.
          if git ls-files | grep -E "^\.env" | grep -vE "^\.env\.example$"; then
            echo "An .env file is tracked; remove it before merging"
            exit 1
          fi
